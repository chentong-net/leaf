plugins {
    alias(libs.plugins.android.application)
}

apply from: rootProject.file("gradle/leaf-assets.gradle")

android {
    namespace 'net.chentong.leaf.demo'
    compileSdk 34

    defaultConfig {
        applicationId "net.chentong.leaf.demo"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity
    implementation libs.material
    implementation project(':leaf-android')
    implementation project(':leaf-plugin')
    implementation project(':file-picker')
    implementation project(':i18n')
    implementation project(':path-provider')
    implementation project(':audio-player')
}
