<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Leaf Engine Web Demo</title>
    <style>
        /* 1. 页面背景：深色，Flex 居中 */
        body {
            margin: 0;
            background-color: #1e1e1e; /* 深灰背景，像展示台 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            height: 100vh;           /* 占满视口高度 */
            overflow: hidden;        /* 防止出现滚动条 */
        }

        /* 2. 模拟手机屏幕 */
        canvas.emscripten {
            display: block;
            aspect-ratio: 9 / 16;
            height: 100vh;
            max-width: 100vw;
            outline: none;
            touch-action: none;
        }
    </style>
</head>
<body>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<script type='text/javascript'>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })()
    };
</script>
{{{ SCRIPT }}}
</body>
</html>
